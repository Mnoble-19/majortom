<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { width: 340px; font-family: system-ui; margin: 0; background: #1a1a2e; color: #eee; }

    .tabs { display: flex; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: #999; background: none; border: none; }
    .tab.active { color: #fff; border-bottom: 2px solid #7ec8e3; margin-bottom: -1px; }

    .panel { display: none; padding: 12px; }
    .panel.active { display: block; }

    /* Settings panel */
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .setting-row label { font-size: 13px; color: #ccc; }
    select { background: #2a2a4e; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font-size: 13px; }

    /* Words panel */
    h1 { font-size: 16px; margin: 0 0 8px; padding: 12px 12px 0; }
    .word-list { max-height: 380px; overflow-y: auto; padding: 0 12px 12px; }
    .word-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid #2a2a3e; }
    .word-text { color: #ffd700; font-weight: bold; font-size: 14px; }
    .word-context { font-size: 11px; color: #999; margin-top: 2px; }
    .word-meta { font-size: 10px; color: #555; margin-top: 2px; }
    .star { cursor: pointer; font-size: 16px; color: #555; flex-shrink: 0; padding-left: 8px; }
    .star.active { color: #ffd700; }
    .empty { color: #666; text-align: center; padding: 30px 0; font-size: 13px; }
    .stats { font-size: 11px; color: #666; margin-bottom: 10px; }
    .group-header { font-size: 11px; color: #666; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="words">Saved Words</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <div id="tab-words" class="panel active">
    <div class="stats" id="stats"></div>
    <div class="word-list" id="wordList"></div>
  </div>

  <div id="tab-settings" class="panel">
    <div class="setting-row">
      <label>Primary language (video)</label>
      <select id="primaryLang">
        <option value="de">German (de)</option>
        <option value="fr">French (fr)</option>
        <option value="es">Spanish (es)</option>
        <option value="it">Italian (it)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="ko">Korean (ko)</option>
        <option value="zh">Chinese (zh)</option>
        <option value="ru">Russian (ru)</option>
        <option value="en">English (en)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Translation language</label>
      <select id="secondaryLang">
        <option value="en">English (en)</option>
        <option value="de">German (de)</option>
        <option value="fr">French (fr)</option>
        <option value="es">Spanish (es)</option>
        <option value="it">Italian (it)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="ko">Korean (ko)</option>
        <option value="zh">Chinese (zh)</option>
        <option value="ru">Russian (ru)</option>
      </select>
    </div>
    <div style="font-size:11px;color:#555;margin-top:8px;">
      Changes take effect on next video load.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
