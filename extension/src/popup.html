<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: system-ui; padding: 12px; margin: 0; background: #1a1a2e; color: #eee; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .word-list { max-height: 400px; overflow-y: auto; }
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #333; }
    .word-text { color: #ffd700; font-weight: bold; }
    .word-context { font-size: 11px; color: #999; margin-top: 2px; }
    .word-meta { font-size: 10px; color: #666; }
    .star { cursor: pointer; font-size: 16px; }
    .star.active { color: #ffd700; }
    .empty { color: #666; text-align: center; padding: 20px; }
    .stats { font-size: 12px; color: #999; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>MajorTom</h1>
  <div class="stats" id="stats"></div>
  <div class="word-list" id="wordList"></div>
  <script src="popup.js"></script>
</body>
</html>
